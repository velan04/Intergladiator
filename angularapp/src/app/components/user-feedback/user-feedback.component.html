<div class="feedback-wrapper">
    <h2 class="section-title">My Feedback</h2>
  
    <div *ngIf="feedbacks.length === 0" class="no-feedback">
      No feedback yet. Be the first to leave one!
    </div>
  
    <div *ngFor="let fb of feedbacks" class="feedback-card">
      <p class="feedback-text">{{ fb.feedbackText }}</p>
      <p class="feedback-text">{{ fb.date | date:'longDate' }}</p>
      <button (click)="openDeleteModal(fb.FeedbackId)" class="delete-btn" title="Delete feedback">Delete</button>

    </div>
  </div>

  <!-- Delete Confirmation Modal -->
<div class="modal-overlay" *ngIf="showDeleteConfirm">
    <div class="modal-box">
      <h3>Confirm Deletion</h3>
      <p>Are you sure you want to delete this feedback?</p>
      <div class="modal-actions">
        <button class="cancel-btn" (click)="cancelDelete()">Cancel</button>
        <button class="confirm-btn" (click)="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>
