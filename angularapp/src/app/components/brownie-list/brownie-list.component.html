<div class="brownie-list-container">
  <div class="header">
    <h2>Manage Brownies</h2>
    <div class="toolbar">
      <input
        type="text"
        placeholder="Search brownies..."
        [(ngModel)]="searchTerm"
        class="search-input"
      />
    
      <select [(ngModel)]="sortOption" class="sort-select">
        <option value="name">Sort by Name</option>
        <option value="priceLowHigh">Price: Low to High</option>
        <option value="priceHighLow">Price: High to Low</option>
        <option value="stockLowHigh">Stock: Low to High</option>
        <option value="stockHighLow">Stock: High to Low</option>
      </select>
    </div>
    
    
  </div>

  <div *ngIf="brownies.length === 0" class="empty-message">
    No brownies available. Add a new one!
  </div>

  <div class="brownie-grid" *ngIf="brownies.length > 0">
    <div class="brownie-card" *ngFor="let brownie of filteredAndSortedBrownies">
      <img [src]="brownie.imageUrl || '/assets/placeholder.jpg'" alt="Brownie Image" />
      
      <div class="brownie-info">
        <h3>{{ brownie.name }}</h3>
        <p class="description">{{ brownie.description }}</p>

        <div class="brownie-footer">
          <span class="stock" [class.out-of-stock]="brownie.stockCount === 0">
            {{ brownie.stockCount > 0 ? 'In Stock (' + brownie.stockCount + ')' : 'Out of Stock' }}
          </span>          
          <span class="price">₹{{ brownie.price }}</span>
        </div>
      </div>

      <div class="button-group">
        <button class="btn-edit" (click)="editBrownie(brownie.id!)">Edit</button>
        <button class="btn-delete" (click)="promptDelete(brownie.id!)">Delete</button>
      </div>
    </div>
  </div>

  <!-- DELETE CONFIRMATION MODAL -->
  <div class="modal-backdrop" *ngIf="showModal">
    <div class="modal">
      <h3>Confirm Delete</h3>
      <p>Are you sure you want to delete this brownie?</p>
      <div class="modal-buttons">
        <button class="btn-cancel" (click)="cancelDelete()">Cancel</button>
        <button class="btn-confirm" (click)="confirmDelete()">Yes, Delete</button>
      </div>
    </div>
  </div>
</div>
